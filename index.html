<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赠送码处理工具(Beta0.3)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 12px; color: #333; }
        .container { max-width:100%; margin: 0 auto; background: #fff; padding: 12px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.8rem; }
        textarea { width: 100%; height: 50px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; resize: vertical; box-sizing: border-box; font-size: 14px; }
        button.process-btn { width: 100%; padding: 12px; background-color: #3498db; color: #fff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        button.process-btn:hover { background-color: #2980b9; }
        .card-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* 卡片基础样式 */
        .card { display: flex; justify-content: space-between; align-items: center; padding: 12px; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; }
        .card-info { display: flex; flex-direction: column; }
        
        /* 花色文字样式 */
        .card-suit { font-size: 1.4rem; font-weight: bold; margin-left:10px; transition: color 0.3s; }
        .card-code { font-family: monospace; color: #666; margin-top: 2px; margin-left:10px; word-break: break-all; }
        
        /* 颜色类 */
        .color-red { color: #e74c3c; } /* 红色 */
        .color-black { color: #2c3e50; } /* 黑色 */
        
        button.copy-btn { padding: 12px 25px; background-color: #2ecc71; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background 0.3s; white-space: nowrap; }
        button.copy-btn:hover { background-color: #27ae60; }
        .empty-tip { text-align: center; color: #999; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>赠送码处理工具(Beta0.3)</h1>
    <textarea id="inputText" placeholder="请在此处粘贴包含花色和兑换码的完整文本..."></textarea>
    <button class="process-btn" id="processBtn">处理赠送码</button>
    <div class="card-list" id="cardList"></div>
</div>

<script>
    // 获取花色颜色的辅助函数
    function getSuitColorClass(suitName) {
        if (suitName.includes('大王') || suitName.includes('红桃') || suitName.includes('♥') || suitName.includes('♦')) {
            return 'color-red';
        }
        if (suitName.includes('小王') || suitName.includes('黑桃') || suitName.includes('♠') || suitName.includes('♣')) {
            return 'color-black';
        }
        return 'color-black';
    }

    // 核心处理逻辑
    function processCodes() {
        const rawText = document.getElementById('inputText').value.trim();
        const cardListDiv = document.getElementById('cardList');
        cardListDiv.innerHTML = ''; 

        if (!rawText) {
            cardListDiv.innerHTML = '<div class="empty-tip">请先粘贴兑换码文本</div>';
            return;
        }

        // 1. 提取所有的兑换码及其位置
        const codeRegex = /([A-Z]{2}#[A-Za-z0-9]+)/g;
        let codeMatches = [...rawText.matchAll(codeRegex)];

        if (codeMatches.length === 0) {
            cardListDiv.innerHTML = '<div class="empty-tip">未识别到有效的兑换码格式</div>';
            return;
        }

        // 辅助函数：寻找真正的花色名称（排除掉兑换码行）
        function findRealSuit(textBefore) {
            const linesBefore = textBefore.split('\n');
            // 从后往前遍历
            for (let i = linesBefore.length - 1; i >= 0; i--) {
                const line = linesBefore[i].trim();
                // 关键修正：如果这一行非空，且【不是】兑换码格式（不包含 #），才认为是花色
                if (line !== '' && !line.includes('#')) {
                    return line;
                }
            }
            return '未知花色';
        }

        // 2. 第一遍遍历：统计每个花色到底有几个兑换码
        let suitCountMap = {}; 
        codeMatches.forEach(match => {
            const codeIndex = match.index;
            const textBefore = rawText.substring(0, codeIndex);
            const currentSuit = findRealSuit(textBefore);
            
            suitCountMap[currentSuit] = (suitCountMap[currentSuit] || 0) + 1;
        });

        // 3. 第二遍遍历：生成展示数据
        let suitCurrentIndex = {}; 
        let cardsData = [];

        codeMatches.forEach(match => {
            const code = match[0];
            const codeIndex = match.index;
            const textBefore = rawText.substring(0, codeIndex);
            const currentSuit = findRealSuit(textBefore);

            // 核心逻辑：如果该花色总数 > 1，则加括号序号；如果总数 == 1，则不加
            let displaySuitName = currentSuit;
            if (suitCountMap[currentSuit] > 1) {
                if (!suitCurrentIndex[currentSuit]) suitCurrentIndex[currentSuit] = 1;
                else suitCurrentIndex[currentSuit]++;
                displaySuitName = `${currentSuit}(${suitCurrentIndex[currentSuit]})`;
            }

            const colorClass = getSuitColorClass(currentSuit);
            cardsData.push({ suit: displaySuitName, code: code, colorClass: colorClass });
        });

        // 4. 渲染卡片
        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-info">
                    <span class="card-suit ${item.colorClass}">${item.suit}</span>
                    <span class="card-code">${item.code}</span>
                </div>
                <button class="copy-btn" data-code="${item.code}">复制</button>
            `;
            cardListDiv.appendChild(card);
        });

        // 5. 绑定复制事件
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const codeToCopy = this.getAttribute('data-code');
                navigator.clipboard.writeText(codeToCopy).then(() => {
                    const originalText = this.textContent;
                    this.textContent = '已复制!';
                    this.style.backgroundColor = '#95a5a6';
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.style.backgroundColor = '#2ecc71';
                    }, 1000);
                }).catch(err => {
                    alert('复制失败，请检查浏览器权限或手动复制: ' + codeToCopy);
                });
            });
        });
    }

    document.getElementById('processBtn').addEventListener('click', processCodes);
</script>
</body>
</html>
