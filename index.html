<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赠送码处理工具(Beta0.4)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 12px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.6rem; }
        
        textarea { width: 100%; height: 60px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; resize: vertical; box-sizing: border-box; font-size: 14px; margin-bottom: 15px; }
        
        /* 按钮组布局 */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; transition: all 0.2s; color: #fff; font-weight: bold; }
        
        /* 买家按钮样式 */
        .btn-buyer { background-color: #3498db; }
        .btn-buyer:hover { background-color: #2980b9; }
        .btn-buyer.active { background-color: #1abc9c; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        
        /* 卡商按钮样式 */
        .btn-merchant { background-color: #9b59b6; }
        .btn-merchant:hover { background-color: #8e44ad; }
        .btn-merchant.active { background-color: #e67e22; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }

        .card-list { display: flex; flex-direction: column; gap: 10px; }
        
        /* 卡片基础样式 */
        .card { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; }
        .card-info { display: flex; flex-direction: column; flex: 1; margin-right: 10px; }
        
        /* 花色文字样式 */
        .card-suit { font-size: 1.3rem; font-weight: bold; transition: color 0.3s; line-height: 1.2; }
        .card-code { font-family: monospace; color: #666; margin-top: 4px; word-break: break-all; font-size: 0.9rem; }
        .card-count { font-size: 0.85rem; color: #e67e22; font-weight: bold; margin-left: 5px; }
        
        /* 颜色类 */
        .color-red { color: #e74c3c; } 
        .color-black { color: #2c3e50; } 
        
        button.copy-btn { padding: 10px 20px; background-color: #2ecc71; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; transition: background 0.3s; white-space: nowrap; }
        button.copy-btn:hover { background-color: #27ae60; }
        .empty-tip { text-align: center; color: #999; margin-top: 20px; padding: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>赠送码处理工具(Beta0.4)</h1>
    <textarea id="inputText" placeholder="请在此处粘贴包含花色和兑换码的完整文本..."></textarea>
    
    <!-- 双按钮区域 -->
    <div class="btn-group">
        <button class="action-btn btn-buyer" id="buyerBtn" onclick="processCodes('buyer')">买家兑换处理</button>
        <button class="action-btn btn-merchant" id="merchantBtn" onclick="processCodes('merchant')">卡商上架处理</button>
    </div>

    <div class="card-list" id="cardList"></div>
</div>

<script>
    // 获取花色颜色的辅助函数
    function getSuitColorClass(suitName) {
        if (suitName.includes('大王') || suitName.includes('红桃') || suitName.includes('♥') || suitName.includes('♦')) {
            return 'color-red';
        }
        if (suitName.includes('小王') || suitName.includes('黑桃') || suitName.includes('♠') || suitName.includes('♣')) {
            return 'color-black';
        }
        return 'color-black';
    }

    // 辅助函数：寻找真正的花色名称（排除掉兑换码行）
    function findRealSuit(textBefore) {
        const linesBefore = textBefore.split('\n');
        for (let i = linesBefore.length - 1; i >= 0; i--) {
            const line = linesBefore[i].trim();
            if (line !== '' && !line.includes('#')) {
                return line;
            }
        }
        return '未知花色';
    }

    // 核心处理逻辑
    function processCodes(mode) {
        // 更新按钮激活状态
        document.getElementById('buyerBtn').className = `action-btn btn-buyer ${mode === 'buyer' ? 'active' : ''}`;
        document.getElementById('merchantBtn').className = `action-btn btn-merchant ${mode === 'merchant' ? 'active' : ''}`;

        const rawText = document.getElementById('inputText').value.trim();
        const cardListDiv = document.getElementById('cardList');
        cardListDiv.innerHTML = ''; 

        if (!rawText) {
            cardListDiv.innerHTML = '<div class="empty-tip">请先粘贴兑换码文本</div>';
            return;
        }

        // 1. 提取所有的兑换码及其位置
        const codeRegex = /([A-Z]{2}#[A-Za-z0-9]+)/g;
        let codeMatches = [...rawText.matchAll(codeRegex)];

        if (codeMatches.length === 0) {
            cardListDiv.innerHTML = '<div class="empty-tip">未识别到有效的兑换码格式</div>';
            return;
        }

        // 2. 数据预处理：将码按花色分组
        // groupedData 结构: { "大王": ["DG#...", "DG#..."], "小王": [...] }
        let groupedData = {};
        let suitOrder = []; // 记录花色出现的顺序

        codeMatches.forEach(match => {
            const code = match[0];
            const codeIndex = match.index;
            const textBefore = rawText.substring(0, codeIndex);
            const currentSuit = findRealSuit(textBefore);

            if (!groupedData[currentSuit]) {
                groupedData[currentSuit] = [];
                suitOrder.push(currentSuit);
            }
            groupedData[currentSuit].push(code);
        });

        // 3. 根据模式渲染界面
        if (mode === 'buyer') {
            renderBuyerMode(groupedData, suitOrder);
        } else {
            renderMerchantMode(groupedData, suitOrder);
        }

        // 4. 绑定复制事件（统一绑定）
        bindCopyEvents();
    }

    // 渲染买家模式（拆分显示）
    function renderBuyerMode(groupedData, suitOrder) {
        const cardListDiv = document.getElementById('cardList');
        let suitCurrentIndex = {}; 

        suitOrder.forEach(suit => {
            const codes = groupedData[suit];
            const totalCount = codes.length;

            codes.forEach((code, index) => {
                // 逻辑：总数>1才加括号序号
                let displaySuitName = suit;
                if (totalCount > 1) {
                    displaySuitName = `${suit}(${index + 1})`;
                }

                const colorClass = getSuitColorClass(suit);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-suit ${colorClass}">${displaySuitName}</span>
                        <span class="card-code">${code}</span>
                    </div>
                    <button class="copy-btn" data-code="${code}">复制</button>
                `;
                cardListDiv.appendChild(card);
            });
        });
    }

    // 渲染卡商模式（合并显示）
    function renderMerchantMode(groupedData, suitOrder) {
        const cardListDiv = document.getElementById('cardList');

        suitOrder.forEach(suit => {
            const codes = groupedData[suit];
            const totalCount = codes.length;
            const firstCode = codes[0];
            
            // 将所有码用换行符拼接，用于复制
            const fullCodeString = codes.join('\n');
            
            const colorClass = getSuitColorClass(suit);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-info">
                    <span class="card-suit ${colorClass}">${suit} <span class="card-count">(等${totalCount}个码)</span></span>
                    <span class="card-code">${firstCode}</span>
                </div>
                <button class="copy-btn" data-code="${fullCodeString.replace(/"/g, '&quot;')}">复制全部</button>
            `;
            cardListDiv.appendChild(card);
        });
    }

    // 统一绑定复制事件
    function bindCopyEvents() {
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const codeToCopy = this.getAttribute('data-code');
                navigator.clipboard.writeText(codeToCopy).then(() => {
                    const originalText = this.textContent;
                    this.textContent = '已复制!';
                    this.style.backgroundColor = '#95a5a6';
                    setTimeout(() => {
                        this.textContent = originalText;
                        this.style.backgroundColor = '#2ecc71';
                    }, 1000);
                }).catch(err => {
                    alert('复制失败，请检查浏览器权限或手动复制');
                });
            });
        });
    }
</script>
</body>
</html>
